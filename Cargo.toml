# One workspace, one target/ and one Cargo.lock for every crate.
[workspace]
members = ["src-tauri", "crates/intportal-core", "crates/intportal-tiles", "crates/intportal-ai", "crates/intportal-llm", "spikes/s0-sis-http", "plugins/tauri-plugin-glance", "plugins/tauri-plugin-calendar", "spikes/s1-llama"]
resolver = "2"

# The app's version; scripts/version.sh sets it with the other version files.
[workspace.package]
version = "0.1.6"

# Line tables only (backtraces keep file:line) keeps target/ a few GB instead
# of tens. Not `debug = false` for dependencies: swift-rs then builds the Tauri
# Swift packages in release, which hides their @_cdecl symbols and the iOS
# link fails.
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
debug = "line-tables-only"

# SPIKE ONLY (issue #157): llama.cpp with arch gemma-embedding2, utilityai/llama-cpp-rs PR #1175.
[patch.crates-io]
llama-cpp-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", branch = "llama-cpp-bump-gemma-embedding2" }
llama-cpp-sys-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", branch = "llama-cpp-bump-gemma-embedding2" }
