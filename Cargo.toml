# One workspace, one target/ and one Cargo.lock for every crate.
[workspace]
members = ["src-tauri", "crates/intportal-core", "crates/intportal-tiles", "crates/intportal-ai", "crates/intportal-llm", "spikes/s0-sis-http", "plugins/tauri-plugin-glance", "plugins/tauri-plugin-calendar", "spikes/s1-llama"]
resolver = "2"

# The app's version; scripts/version.sh sets it with the other version files.
[workspace.package]
version = "0.1.6"

# Line tables only (backtraces keep file:line) keeps target/ a few GB instead
# of tens. Not `debug = false` for dependencies: swift-rs then builds the Tauri
# Swift packages in release, which hides their @_cdecl symbols and the iOS
# link fails.
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
debug = "line-tables-only"

# llama.cpp v0.7.0 for arch `gemma-embedding2` (EmbeddingGemma-2, issue #157).
# llama-cpp-2 0.1.160 (crates.io, llama.cpp 26394b4e) cannot load it. This is
# utilityai/llama-cpp-rs PR #1175, still open: drop the patch and use the
# crates.io release once it ships a llama.cpp at or after v0.7.0. Pinned to a
# commit, never a branch; cargo fetches the llama.cpp submodules itself.
[patch.crates-io]
llama-cpp-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", rev = "cb98c630d0fec934a8a379db4fd63cd3622f6984" }
llama-cpp-sys-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", rev = "cb98c630d0fec934a8a379db4fd63cd3622f6984" }
