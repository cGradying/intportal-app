<style>
/* Study picks, round two. Live phones at real size (320 wide, real type sizes),
   so what reads here reads on the phone. Page chrome stays in the portal's night. */
:root {
  color-scheme: dark;
  --void: #0b0710; --void-2: #140c16; --void-3: #1d1222;
  --line: rgb(244 236 216 / 0.12);
  --parch: #f4ecd8; --parch-2: rgb(244 236 216 / 0.7); --parch-3: rgb(244 236 216 / 0.5);
  --pg: #f5b227; --pg-shade: #b87a10; --on-pg: #1b1406;
  --f-head: "Montserrat", system-ui, sans-serif;
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --f-pixel: "Pixelify Sans", ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --n3: polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px));
  --n4: polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  --n6: polygon(0 12px,6px 12px,6px 6px,12px 6px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 6px,calc(100% - 6px) 6px,calc(100% - 6px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 6px) calc(100% - 12px),calc(100% - 6px) calc(100% - 6px),calc(100% - 12px) calc(100% - 6px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 6px),6px calc(100% - 6px),6px calc(100% - 12px),0 calc(100% - 12px));
}
* { box-sizing: border-box; }
html { background: var(--void); }
body { margin: 0; background: var(--void); color: var(--parch); font: 400 15px/1.5 var(--f-ui); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; }
::selection { background: var(--pg); color: var(--on-pg); }
:focus-visible { outline: 2px solid var(--pg); outline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; }
.top { padding-block: 40px 8px; display: grid; gap: 12px; }
.top h1 { margin: 0; font: 800 clamp(28px, 5vw, 42px)/1.05 var(--f-head); letter-spacing: -0.02em; text-wrap: balance; max-width: 24ch; }
.top p { margin: 0; color: var(--parch-2); max-width: 68ch; }
.settled { display: flex; flex-wrap: wrap; gap: 6px; }
.settled span { font: 500 12px var(--f-pixel); letter-spacing: 0.04em; padding: 4px 8px; color: var(--on-pg); background: var(--pg); }
nav.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 6px; flex-wrap: wrap; padding-block: 12px; background: linear-gradient(var(--void) 75%, transparent); }
nav.jump a { font: 500 13px var(--f-pixel); letter-spacing: 0.06em; color: var(--parch-2); text-decoration: none; padding: 6px 10px; box-shadow: inset 0 0 0 1px var(--line); }
nav.jump a:hover { color: var(--parch); box-shadow: inset 0 0 0 1px var(--parch-3); }
section.row { padding-block: 44px 8px; display: grid; gap: 18px; scroll-margin-top: 56px; }
.q { display: grid; gap: 6px; max-width: 70ch; }
.q h2 { margin: 0; font: 700 clamp(21px, 3vw, 26px)/1.2 var(--f-head); letter-spacing: -0.01em; text-wrap: balance; }
.q p { margin: 0; color: var(--parch-2); }
.opt { display: grid; gap: 12px; justify-items: center; min-width: 0; width: 100%; max-width: 340px; }
.name { width: 100%; display: grid; gap: 3px; }
.name b { font: 600 15px var(--f-ui); }
.name span { font-size: 13px; color: var(--parch-2); }
.pick { width: 100%; height: 42px; border: 0; font: 600 14px var(--f-ui); color: var(--parch); background: var(--void-3); box-shadow: inset 0 0 0 1px var(--line); clip-path: var(--n3); }
.pick:hover { background: #26172b; }
.pick[aria-pressed="true"] { background: var(--pg); color: var(--on-pg); box-shadow: inset 0 -3px 0 var(--pg-shade); }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.panel { background: var(--void-2); box-shadow: inset 0 0 0 1px var(--line); padding: 18px; display: grid; gap: 12px; min-width: 0; width: 100%; }
.panel h3 { margin: 0; font: 600 15px var(--f-ui); }
.panel p { margin: 0; font-size: 13px; color: var(--parch-2); }
.panel textarea { width: 100%; min-height: 76px; padding: 10px; border: 0; background: var(--void); box-shadow: inset 0 0 0 1px var(--line); font: 13px/1.4 ui-monospace, monospace; word-break: break-all; }
.pbtn { height: 40px; padding: 0 14px; border: 0; background: var(--void-3); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 14px; }
.pbtn:hover { background: #26172b; }
.panel dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.panel dt { color: var(--parch-2); } .panel dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.wide { display: grid; gap: 30px 28px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: start; justify-items: center; }
.leg { display: grid; grid-template-columns: 18px 1fr; gap: 8px 10px; align-items: center; font-size: 13px; color: var(--parch-2); }
.leg i { display: block; width: 12px; height: 12px; }
.seg0 { display: inline-flex; flex-wrap: wrap; box-shadow: inset 0 0 0 1px var(--line); width: fit-content; }
.seg0 button { border: 0; background: none; padding: 8px 12px; font-size: 13px; color: var(--parch-2); }
.seg0 button[aria-pressed="true"] { background: var(--void-3); color: var(--parch); box-shadow: inset 0 -2px 0 var(--pg); }
.iconsheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 12px 6px; --gold: var(--pg); }
.iconsheet div { display: grid; gap: 5px; justify-items: center; font-size: 11px; color: var(--parch-2); text-align: center; line-height: 1.15; }

/* ---------- tray ---------- */
.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--void-2) 94%, transparent); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 var(--line); }
.tray .in { max-width: 1120px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.tray .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tray .chips span { flex: none; font: 500 11px var(--f-pixel); letter-spacing: 0.04em; padding: 4px 8px; box-shadow: inset 0 0 0 1px var(--line); color: var(--parch-3); }
.tray .chips span.set { color: var(--on-pg); background: var(--pg); box-shadow: none; }
.tray .toast { font-size: 12px; color: var(--parch-2); }
.tray .copy { flex: none; height: 40px; padding: 0 16px; border: 0; background: var(--void-3); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 14px; clip-path: var(--n3); }

/* ---------- the phone ---------- */
.phone { width: 320px; height: 672px; position: relative; overflow: hidden; border-radius: 36px; box-shadow: 0 0 0 7px #1a1520, 0 0 0 8px #2f2939, 0 24px 50px rgb(0 0 0 / 0.5); background-color: var(--ground); color: var(--ink); isolation: isolate; flex: none; font: 400 15px/1.35 var(--f-ui); --f-title: var(--f-ui); --title-w: 800; --title-t: -0.035em; --corner: var(--n4); --corner-s: var(--n3); --r: 0px; }
.phone .island { position: absolute; top: 9px; left: 50%; translate: -50% 0; width: 86px; height: 24px; border-radius: 12px; background: #000; z-index: 70; }
.phone .status { position: absolute; top: 12px; left: 26px; right: 22px; display: flex; justify-content: space-between; font: 600 13px var(--f-ui); z-index: 69; }
.phone button { color: inherit; }
.ground { position: absolute; inset: 0; z-index: -1; overflow: hidden; background-color: var(--ground); }
.ground::before, .ground::after { content: ""; position: absolute; inset: -45%; pointer-events: none; opacity: var(--aura-o, 1); will-change: transform; }
.ground::before { background: radial-gradient(32% 24% at 32% 30%, var(--aura-a), transparent 72%), radial-gradient(30% 22% at 70% 68%, var(--aura-b), transparent 72%); animation: aura1 13s ease-in-out infinite alternate; }
.ground::after { background: radial-gradient(26% 24% at 66% 28%, var(--aura-c), transparent 72%), radial-gradient(30% 20% at 26% 72%, var(--aura-b), transparent 72%); animation: aura2 17s ease-in-out infinite alternate; }
.ground i { position: absolute; inset: 0; z-index: 1; }
.ground[data-p="dots"] i { background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 14px 14px; }
.ground[data-p="bold"] i { background-image: radial-gradient(var(--dot) 2px, transparent 2.3px); background-size: 14px 14px; }
.ground[data-p="checks"] i { background: conic-gradient(var(--dot) 25%, transparent 0 50%, var(--dot) 0 75%, transparent 0) 0 0 / 16px 16px; }
.ground[data-p="lines"] i { background: repeating-linear-gradient(var(--dot) 0 2px, transparent 0 10px); }
.ground[data-p="grid"] i { background: linear-gradient(var(--dot) 1px, transparent 0) 0 0 / 14px 14px, linear-gradient(90deg, var(--dot) 1px, transparent 0) 0 0 / 14px 14px; }
.ground[data-p="squares"] i, .ground[data-p="plus"] i, .ground[data-p="hearts"] i, .ground[data-p="stars"] i { background: var(--dot); -webkit-mask: var(--mask) 0 0 / var(--msz, 14px) var(--msz, 14px); mask: var(--mask) 0 0 / var(--msz, 14px) var(--msz, 14px); }
.ground[data-p="squares"] i { --mask: var(--m-squares); }
.ground[data-p="plus"] i { --mask: var(--m-plus); --msz: 16px; }
.ground[data-p="hearts"] i { --mask: var(--m-hearts); --msz: 20px; }
.ground[data-p="stars"] i { --mask: var(--m-stars); --msz: 24px; }
@keyframes aura1 { from { transform: translate(-9%, -7%) rotate(-8deg); } to { transform: translate(10%, 9%) rotate(10deg); } }
@keyframes aura2 { from { transform: translate(10%, 7%) rotate(9deg); } to { transform: translate(-10%, -9%) rotate(-7deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

.view { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 48px 14px 196px; display: flex; flex-direction: column; gap: 12px; }
.view > * { flex: none; min-width: 0; }
.view::-webkit-scrollbar { display: none; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; padding: 8px 4px 20px; display: grid; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--ground) 86%, transparent); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 var(--edge); z-index: 30; }
.tabs button { display: grid; justify-items: center; gap: 2px; padding: 0; border: 0; background: none; font: 500 11px var(--f-pixel); letter-spacing: 0.04em; color: var(--ink-3) !important; }
.tabs button.on { color: var(--gold) !important; }
svg.pi { display: block; flex: none; }
.lb { margin: 0; font: 500 12px var(--f-pixel); letter-spacing: 0.06em; color: var(--ink-3); }
.ttl { margin: 0; font: var(--title-w) 28px/1.08 var(--f-title); letter-spacing: var(--title-t); color: var(--ink); }
.sub { margin: 0; font-size: 13px; color: var(--ink-2); }
.card { background: linear-gradient(var(--card-2), var(--card)); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--corner); border-radius: var(--r); padding: 14px; }
.phone[data-cards="outline"] .card { background: none; box-shadow: inset 0 0 0 1.5px var(--edge-2); }
.phone[data-cards="tint"] .card { background: color-mix(in srgb, var(--gold) 14%, var(--card)); }
.btn { min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; font-weight: 700; font-size: 14px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge-2); color: var(--ink); transition: scale 0.16s var(--spring); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active, .sq:active, .rowb:active { scale: 0.97; }
.btn.go { background: var(--gold); color: var(--on-gold) !important; box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.22); }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: 0.45; }
.rowb { width: 100%; min-height: 48px; padding: 9px 12px; border: 0; background: none; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--ink); transition: scale 0.16s var(--spring); }
.rowb strong { display: block; font-weight: 600; font-size: 15px; line-height: 1.25; }
.rowb small { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowb > .tx { flex: 1; min-width: 0; }
.rowb > .val { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.list > * + * { box-shadow: inset 0 1px 0 var(--edge); }
.tile { width: 12px; height: 12px; flex: none; background: var(--c, var(--gold)); clip-path: polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px)); }
.pin { color: var(--gold); }
.search { height: 42px; width: 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: 0; color: var(--ink); font-size: 16px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); border-radius: 10px; }
.seg button { min-height: 36px; border: 0; background: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2) !important; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold) !important; }
.fine { margin: 0; font-size: 13px; line-height: 1.35; color: var(--ink-2); }
.field { display: grid; gap: 6px; }
.sw { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.sw span { flex: 1; }
.pchk { appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 0; display: inline-grid; place-items: center; background: var(--sunk); box-shadow: inset 0 0 0 2px var(--ink-3); clip-path: polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px)); border: 0; padding: 0; }
.pchk:checked, .pchk.on { background: var(--gold); box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.25); animation: stampin 0.22s var(--spring) backwards; }
.pchk:checked::after, .pchk.on::after { content: ""; width: 12px; height: 9px; background: var(--on-gold); clip-path: polygon(0 50%, 25% 50%, 25% 75%, 37.5% 75%, 37.5% 50%, 62.5% 50%, 62.5% 25%, 75% 25%, 75% 0, 100% 0, 100% 25%, 87.5% 25%, 87.5% 50%, 75% 50%, 75% 75%, 62.5% 75%, 62.5% 100%, 25% 100%, 25% 75%, 0 75%); }
@keyframes stampin { from { scale: 0.6; } }

/* due strip */
.strip { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.strip .st { display: grid; gap: 2px; }
.strip .btn { margin-left: auto; }

/* the notebook shelf: every pixel is data */
.spines { display: flex; align-items: flex-end; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; margin-inline: -14px; padding: 20px 14px 0; min-height: 176px; }
.spines::-webkit-scrollbar { display: none; }
.spine { position: relative; flex: none; width: 70px; height: var(--h, 128px); border: 0; padding: 8px 6px 6px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; color: var(--on-c, #fff) !important; background: var(--c); clip-path: var(--n3); box-shadow: inset 3px 0 0 rgb(255 255 255 / 0.16), inset -3px 0 0 rgb(0 0 0 / 0.22), inset 0 -3px 0 rgb(0 0 0 / 0.22); transition: translate 0.3s var(--spring), height 0.3s var(--spring); }
.spine b { font: 800 14px/1.05 var(--f-ui); letter-spacing: -0.01em; }
.spine small { font: 600 12px/1.05 var(--f-ui); font-variant-numeric: tabular-nums; }
.spine[aria-pressed="true"] { translate: 0 -14px; }
.well { margin-top: auto; width: 100%; padding: 3px; background: rgb(0 0 0 / 0.42); display: flex; flex-wrap: wrap-reverse; align-content: flex-start; gap: 2px; min-height: 22px; }
.well u { display: block; width: 8px; height: 8px; text-decoration: none; }
.well u.n { background: #fff6dc; }
.well u.d { background: #f5b227; animation: duebeat 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.23s); box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.25); }
.well u.tw { animation: twinkle 0.6s ease-in-out; }
.well u.in { animation: pxin 0.5s var(--spring) backwards; }
.well u.out { animation: pxout 0.32s var(--ease) forwards; }
.well u.rip { animation: rip 0.4s ease-out; animation-delay: calc(var(--i) * 34ms); }
@keyframes duebeat { 50% { opacity: 0.55; } }
@keyframes twinkle { 50% { background: #fff; scale: 1.25; } }
@keyframes pxin { from { translate: 0 -46px; } }
@keyframes pxout { to { translate: 0 -34px; opacity: 0; scale: 0.5; } }
@keyframes rip { 40% { translate: 0 -5px; background: #fff; } }
.ledge { height: 8px; margin: -2px -14px 0; background: var(--card-2); box-shadow: inset 0 2px 0 var(--edge-2), 0 8px 12px rgb(0 0 0 / 0.25); position: relative; z-index: 1; }
.pulled { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.flypx { position: absolute; width: 8px; height: 8px; background: #f5b227; z-index: 35; pointer-events: none; transition: translate 0.5s var(--ease), opacity 0.5s steps(3); }

/* the crystal: one floating button, cube or + */
.crystal { position: absolute; right: 14px; bottom: 82px; width: 48px; height: 48px; padding: 0; border: 0; background: linear-gradient(var(--card-2), var(--card)); box-shadow: inset 0 0 0 1px var(--edge-2); clip-path: var(--n3); z-index: 31; display: grid; -webkit-tap-highlight-color: transparent; transition: scale 0.16s var(--spring); }
.crystal:active { scale: 0.92; }
.crystal.open { z-index: 61; }
.sheet.above { bottom: 138px; }
.ed .sheet.above { bottom: 74px; }
.crystal.low { bottom: 18px; }
.crystal canvas { grid-area: 1 / 1; width: 100%; height: 100%; }
.crystal.hero { position: relative; right: auto; bottom: auto; width: 168px; height: 168px; margin: 8px auto; z-index: 0; cursor: pointer; clip-path: var(--n6); }
.stage { position: relative; isolation: isolate; overflow: hidden; display: grid; gap: 8px; padding: 12px; color: var(--ink); background-color: var(--ground); font: 400 15px/1.35 var(--f-ui); --corner: var(--n4); --r: 0px; }
.stagecard { display: flex; align-items: center; gap: 8px; padding: 6px 10px; clip-path: var(--n4); }
.stagecard .drow { flex: 1; min-width: 0; }
.stagecard .sizes { gap: 6px; flex: none; }
.heropanel { background: var(--void-2); box-shadow: inset 0 0 0 1px var(--line); padding: 20px 18px 18px; display: grid; gap: 14px; width: 100%; min-width: 0; }
.sizes { display: flex; align-items: flex-end; justify-content: center; gap: 22px; }
.sizes .crystal { position: relative; right: auto; bottom: auto; }
.lrange { display: grid; gap: 4px; font-size: 13px; color: var(--parch-2); }
.lrange input { width: 100%; accent-color: var(--pg); }

/* editor */
.ed { display: flex; flex-direction: column; position: absolute; inset: 0; z-index: 32; background: var(--ground); padding-top: 44px; --fs: 16px; --lh: 1.4; --ff: var(--f-ui); }
.ed .bar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; flex: none; }
.ed .bar .ib { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--ink-2) !important; transition: scale 0.14s var(--spring); }
.ed .bar .ib:active { scale: 0.86; }
.ed .bar .sp { flex: 1; }
.ed .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; background-attachment: local; }
.ed .sheet-body > * { flex: none; }
.ed .sheet-body[data-paper="lines"] { background-image: repeating-linear-gradient(transparent 0 calc(var(--fs) * var(--lh) + 5px), var(--edge) 0 calc(var(--fs) * var(--lh) + 6px)); }
.ed .sheet-body[data-paper="dots"] { background-image: radial-gradient(var(--edge-2) 1px, transparent 1.2px); background-size: 14px 14px; }
.ed .sheet-body[data-paper="grid"] { background-image: linear-gradient(var(--edge) 1px, transparent 0), linear-gradient(90deg, var(--edge) 1px, transparent 0); background-size: 14px 14px; }
.ed input.nm { border: 0; background: none; outline: 0; width: 100%; font: var(--title-w) 24px/1.1 var(--f-title); letter-spacing: -0.03em; color: var(--ink); padding: 0; }
.ed .where { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); min-height: 28px; font-variant-numeric: tabular-nums; }
.blk { display: flex; align-items: flex-start; gap: 8px; min-height: 26px; font: 400 var(--fs)/var(--lh) var(--ff); border-radius: 4px; }
.blk > [contenteditable], .blk > .tx { flex: 1; min-width: 0; outline: 0; caret-color: var(--gold); }
.blk.h > * { font-weight: 800; font-size: calc(var(--fs) + 2px); letter-spacing: -0.02em; margin-top: 8px; }
.blk.b::before { content: ""; width: 6px; height: 6px; margin: calc(var(--fs) * 0.5) 3px 0; flex: none; background: var(--gold); }
.blk.n::before { content: attr(data-n) "."; flex: none; min-width: 16px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.blk.q { padding: 2px 0 2px 10px; background: linear-gradient(var(--gold), var(--gold)) 0 0 / 3px 100% no-repeat; color: var(--ink-2); }
.blk.code { padding: 8px 10px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); font: 13px/1.45 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; }
.blk.d { font-weight: 700; color: var(--gold); font-size: calc(var(--fs) - 1px); margin-top: 6px; }
.blk.hr { min-height: 18px; align-items: center; justify-content: center; gap: 6px; }
.blk.hr i { width: 6px; height: 6px; background: var(--ink-3); }
.blk.hr i:nth-child(2) { background: var(--gold); }
.blk.c .pchk { margin-top: 1px; }
.blk.c.on > [contenteditable] { color: var(--ink-3); text-decoration: line-through; }
.blk mark { background: color-mix(in srgb, var(--gold) 34%, transparent); color: inherit; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--gold); }
.blk .tm { font-weight: 700; }
.pstrip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
.pstrip:empty { display: none; }
.pstrip::-webkit-scrollbar { display: none; }
.pstrip canvas { flex: none; height: 84px; width: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; clip-path: var(--n3); }
.selbar { position: absolute; left: 10px; bottom: 18px; z-index: 32; display: flex; gap: 2px; padding: 3px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge-2); clip-path: var(--n3); }
.selbar button { width: 40px; height: 42px; display: grid; place-items: center; border: 0; background: none; }
.sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 60; padding: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge-2); clip-path: var(--n4); display: grid; gap: 10px; animation: sheetin 0.3s var(--ease) both; max-height: 86%; overflow-y: auto; scrollbar-width: none; }
.scrim { position: absolute; inset: 0; z-index: 59; background: rgb(0 0 0 / 0.45); animation: fadein 0.2s both; border: 0; width: 100%; }
@keyframes sheetin { from { translate: 0 36px; } }
@keyframes fadein { from { opacity: 0; } }
.sheet h4 { margin: 0; font: 800 18px/1.1 var(--f-ui); letter-spacing: -0.03em; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tools button { min-height: 62px; padding: 8px 2px 6px; border: 0; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--n3); display: grid; gap: 4px; justify-items: center; align-content: center; font-size: 12px; font-weight: 600; line-height: 1.05; transition: translate 0.12s var(--ease); }
.tools button:active { translate: 0 1px; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tgrid button { min-height: 66px; padding: 10px; border: 0; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); display: grid; gap: 4px; align-content: start; justify-items: start; text-align: left; clip-path: var(--n3); }
.tgrid button strong { font-size: 14px; }
.tgrid button small { font-size: 12px; line-height: 1.2; color: var(--ink-2); }
.pickline { padding: 4px 6px; margin-inline: -6px; box-shadow: inset 0 0 0 1px var(--edge); }
.pickline.on { background: var(--gold-soft); box-shadow: inset 0 0 0 1.5px var(--gold); }
.pkbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 24px; background: var(--card-2); box-shadow: inset 0 1px 0 var(--edge-2); }
.ed.picking .crystal { display: none; }
.card-rev { display: grid; gap: 4px; padding: 8px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--n3); }
.card-rev input { border: 0; background: none; outline: 0; width: 100%; font-size: 15px; min-height: 24px; }
.card-rev input + input { color: var(--ink-2); font-size: 14px; }
.bigstamp { position: absolute; left: 50%; top: 40%; z-index: 80; translate: -50% -50%; padding: 8px 14px; font: 700 24px var(--f-pixel); letter-spacing: 0.06em; color: var(--gold); box-shadow: inset 0 0 0 3px currentColor; background: var(--card); rotate: -7deg; animation: thunk 0.36s var(--ease) both; white-space: nowrap; pointer-events: none; }
@keyframes thunk { from { scale: 1.9; opacity: 0; } 60% { scale: 0.97; opacity: 1; } }
.menu { display: grid; }
.menu button { min-height: 46px; border: 0; background: none; display: flex; align-items: center; gap: 12px; padding: 0 4px; font-size: 15px; font-weight: 600; text-align: left; box-shadow: inset 0 1px 0 var(--edge); }
.menu button:first-child { box-shadow: none; }
.menu span { color: var(--ink-2); }
.menu .val { margin-left: auto; font-size: 13px; font-weight: 400; }

/* You, one-handed */
.ytop { display: flex; align-items: flex-end; justify-content: space-between; min-height: 76px; margin-top: -16px; }
.ytop canvas { margin: 0 -22px -10px 0; image-rendering: pixelated; }
.yrow { min-height: 50px; }
.yi { width: 26px; display: grid; place-items: center; color: var(--ink-2); }
.ydock { position: absolute; left: 0; right: 0; bottom: 70px; z-index: 28; display: grid; gap: 8px; padding: 22px 14px 10px; background: linear-gradient(transparent, var(--ground) 18px); }
.yqk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.yqk button { min-height: 56px; border: 0; padding: 7px 2px 5px; display: grid; justify-items: center; gap: 3px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--n3); color: var(--ink-3) !important; font-size: 11px; font-weight: 600; line-height: 1.05; transition: translate 0.12s var(--ease), box-shadow 0.16s var(--ease), color 0.16s var(--ease); }
.yqk button[aria-pressed="true"] { color: var(--ink) !important; box-shadow: inset 0 0 0 1px var(--gold), inset 0 -2px 0 var(--gold); }
.yqk button[aria-pressed="true"] svg { color: var(--gold); }
.yqk button:active { translate: 0 1px; }
.phone:has(.ydock) > .view { padding-bottom: 276px; }
.ypage { position: absolute; inset: 0 0 70px; z-index: 29; background: var(--ground); display: flex; flex-direction: column; padding-top: 48px; }
.ypage.in { animation: ypin 0.26s var(--ease) both; }
@keyframes ypin { from { translate: 22px 0; } }
.yb { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.yb > * { flex: none; }
.yback { flex: none; min-height: 50px; margin: 0 14px 10px; border: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 15px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge-2); clip-path: var(--n3); }
.ysw { min-height: 50px; }
.ysw + .ysw { box-shadow: inset 0 1px 0 var(--edge); }
.yseg button { min-height: 44px; }
.yswatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.yswatches button { min-height: 56px; padding: 8px 10px; border: 0; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 13px; font-weight: 600; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--n3); }
.yswatches button.on { box-shadow: inset 0 0 0 2px var(--gold); }
.yswatches span { display: flex; flex: none; } .yswatches i { width: 12px; height: 18px; }
.reorder { display: flex; align-items: center; gap: 8px; min-height: 50px; }
.reorder + .reorder { box-shadow: inset 0 1px 0 var(--edge); }
.reorder span { flex: 1; font-size: 15px; }
.reorder.off span { color: var(--ink-3); }
.reorder button { width: 40px; height: 40px; border: 0; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); border-radius: 8px; display: grid; place-items: center; }
.reorder button:disabled { opacity: 0.35; }
.phone[data-density="compact"] .yrow, .phone[data-density="compact"] .rowb { min-height: 44px; padding-block: 5px; }
.phone[data-density="compact"] .rowb small { display: none; }

/* studio */
.studio { display: flex; flex-direction: column; height: 100%; }
.prev { flex: none; height: 278px; position: relative; overflow: hidden; isolation: isolate; box-shadow: 0 1px 0 var(--edge-2); padding: 44px 12px 8px; display: grid; gap: 7px; align-content: start; }
.pvtabs { display: flex; gap: 4px; justify-content: center; }
.pvtabs button { min-height: 26px; padding: 0 9px; border: 0; background: color-mix(in srgb, var(--card) 80%, transparent); box-shadow: inset 0 0 0 1px var(--edge); font: 500 12px var(--f-pixel); letter-spacing: 0.04em; color: var(--ink-2) !important; clip-path: var(--n3); }
.pvtabs button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold) !important; }
.prev .hero { padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: end; }
.prev .hero b { font: var(--title-w) 16px/1.1 var(--f-title); letter-spacing: -0.02em; color: var(--gold); }
.prev .hero span { font-size: 13px; color: var(--ink-2); }
.prev .hero .t { grid-row: 1 / 3; grid-column: 2; color: var(--ink); }
.prev .r { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.prev .r em { font-style: normal; font-weight: 700; color: var(--gold); width: 50px; flex: none; }
.prev .r .x { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prev canvas.dive { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; image-rendering: pixelated; }
.prev .pvtabs { position: relative; z-index: 2; }
.prev canvas.lar { position: absolute; right: 36px; bottom: -14px; z-index: 3; image-rendering: pixelated; pointer-events: none; }
.prev .minis { display: flex; gap: 4px; align-items: flex-end; height: 92px; }
.prev .minis .spine { width: 48px; padding: 5px 4px; pointer-events: none; }
.prev .minis .spine b { font-size: 12px; }
.ctrls { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; background: var(--ground); scrollbar-width: none; }
.ctrls::-webkit-scrollbar { display: none; }
.sections { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--ground); box-shadow: inset 0 1px 0 var(--edge); }
.sections button { min-height: 62px; padding-bottom: 14px; border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--ink-3) !important; }
.sections button[aria-pressed="true"] { color: var(--ink) !important; box-shadow: inset 0 3px 0 var(--gold); }
.dice { position: absolute; right: 10px; bottom: 10px; z-index: 4; width: 48px; height: 48px; display: grid; place-items: center; border: 0; background: linear-gradient(var(--card-2), var(--card)); box-shadow: inset 0 0 0 1px var(--edge-2); clip-path: var(--n3); }
.dice.roll svg { animation: rolld 0.5s var(--ease); }
@keyframes rolld { to { rotate: 360deg; } }
.presets { display: flex; gap: 6px; min-height: 44px; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding-inline: 14px; }
.presets::-webkit-scrollbar { display: none; }
.presets button { flex: none; min-height: 44px; padding: 0 10px; border: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--n3); }
.presets i { width: 10px; height: 10px; }
.ctrls input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: none; margin: 0; }
.ctrls input[type="range"]::-webkit-slider-runnable-track { height: 16px; background: var(--trk, var(--sunk)); box-shadow: inset 0 0 0 1px var(--edge-2); }
.ctrls input[type="range"]::-moz-range-track { height: 16px; background: var(--trk, var(--sunk)); box-shadow: inset 0 0 0 1px var(--edge-2); }
.ctrls input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 36px; margin-top: -10px; background: var(--ink); box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.3); border: 0; border-radius: 0; }
.ctrls input[type="range"]::-moz-range-thumb { width: 28px; height: 36px; background: var(--ink); border: 0; border-radius: 0; }
.ctrls .nm { height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); font-size: 16px; width: 100%; outline: 0; }
.patterns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.patterns button { position: relative; aspect-ratio: 1; padding: 0; border: 0; overflow: hidden; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); clip-path: var(--n3); font-size: 11px; font-weight: 600; color: var(--ink-3) !important; }
.patterns button .ground { z-index: 0; --dot: var(--ink-2); background: none; }
.patterns button .ground::before, .patterns button .ground::after { display: none; }
.patterns button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold); }
.tune { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tune label { display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--ink-2); }
.tune input[type="color"] { width: 100%; height: 36px; padding: 0; border: 0; background: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tcard { position: relative; overflow: hidden; isolation: isolate; padding: 12px; display: grid; gap: 8px; justify-items: center; clip-path: var(--corner); border-radius: var(--r); box-shadow: inset 0 0 0 2px var(--gold); }
.tcard h5 { margin: 0; font: var(--title-w) 18px/1.1 var(--f-title); letter-spacing: var(--title-t); color: var(--ink); text-align: center; }
.qrbox { padding: 8px; background: #fff; clip-path: var(--n3); line-height: 0; }
.code { padding: 8px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--edge); font: 12px/1.35 ui-monospace, monospace; word-break: break-all; color: var(--ink); }

/* done */
.mini { position: relative; color: var(--ink); background-color: var(--ground); padding: 12px; font: 400 15px/1.35 var(--f-ui); isolation: isolate; overflow: hidden; }
.drow { position: relative; display: flex; align-items: center; gap: 10px; min-height: 56px; transition: scale 0.2s var(--ease); }
.drow em { font-style: normal; font-weight: 700; font-size: 13px; width: 50px; flex: none; color: var(--gold); }
.drow .x { flex: 1; min-width: 0; }
.drow .x b { display: block; font-weight: 600; font-size: 15px; line-height: 1.2; }
.drow .x small { font-size: 13px; color: var(--ink-2); }
.drow.gone .x b { text-decoration: line-through; color: var(--ink-3); }
.sq { flex: none; width: 44px; height: 48px; border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--ink-2); transition: scale 0.14s var(--spring); }
.sq .pchk { pointer-events: none; }
.pill { flex: none; height: 38px; padding: 0 12px; border: 0; background: none; box-shadow: inset 0 0 0 1.5px var(--gold); color: var(--gold); font-weight: 700; font-size: 13px; clip-path: var(--n3); }
.pill.on { background: var(--gold); color: var(--on-gold); }
.ministamp { position: absolute; right: 8px; top: 6px; padding: 2px 6px; font: 700 13px var(--f-pixel); letter-spacing: 0.06em; color: var(--gold); box-shadow: inset 0 0 0 2px currentColor; rotate: -7deg; animation: thunk 0.36s var(--ease) both 0.2s; }
/* Phones narrower than a mock phone plus the gutters: shrink the mock, not the page. */
@media (max-width: 360px) { .phone { zoom: 0.86; } }

/* ---------------- shared: LAR's header ----------------
   The sky stage from the old sheet, inside the glass: a solid band in the portal's ramp with slow
   pools of light and a few pixel stars, split from the chat by a dithered pixel edge. Everything
   stands on that edge, the horizon: LAR's feet, his name and status, and the two buttons, on one
   line. The buttons are one pair: 36 px pixel-cut keys, both icons on the same 7 x 7 pixel grid.
   With the keyboard up or the chat scrolled it folds to 64 px and LAR shrinks with it. */
.lh { --lh-h: 104px; --lh-base: 14px; position: relative; flex: none; height: var(--lh-h); display: flex; align-items: flex-end; gap: 4px; padding: 0 10px var(--lh-base) 4px; isolation: isolate; color: #fff6dc; transition: height 0.34s var(--ease), padding 0.34s var(--ease); }
.lh-sky { position: absolute; inset: 0; z-index: -1; overflow: hidden;
  background:
    radial-gradient(42% 70% at 18% 100%, color-mix(in srgb, var(--r3) 70%, transparent), transparent 70%),
    radial-gradient(38% 80% at 86% 0%, color-mix(in srgb, var(--r4) 30%, transparent), transparent 70%),
    radial-gradient(60% 90% at 62% 118%, color-mix(in srgb, var(--r2) 80%, transparent), transparent 75%),
    linear-gradient(172deg, var(--r0), var(--r1) 72%, var(--r0));
  background-size: 180% 160%, 200% 180%, 160% 140%, 100% 100%;
  background-position: 0% 100%, 100% 0%, 50% 100%, 0 0;
  box-shadow: inset 0 1px 0 rgb(255 236 214 / 0.2);
  animation: lhDrift 16s ease-in-out infinite alternate; }
.lh-sky i { position: absolute; width: 2px; height: 2px; background: #fff6dc; animation: lhTw 2.6s steps(3, jump-none) infinite alternate; }
.lh-sky i:nth-child(1) { left: 38%; top: 14px; } .lh-sky i:nth-child(2) { left: 54%; top: 30px; opacity: 0.6; animation-delay: -0.8s; }
.lh-sky i:nth-child(3) { left: 66%; top: 10px; animation-delay: -1.6s; } .lh-sky i:nth-child(4) { left: 74%; top: 38px; opacity: 0.5; animation-delay: -0.4s; }
.lh-sky i:nth-child(5) { left: 47%; top: 22px; opacity: 0.7; animation-delay: -2s; } .lh-sky i:nth-child(6) { left: 61%; top: 44px; opacity: 0.4; animation-delay: -1.2s; }
/* The split: a 2-row dither from the sky into the glass. */
.lh-sky::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
  background: conic-gradient(var(--g-a) 25%, transparent 0 50%, var(--g-a) 0 75%, transparent 0) 0 0 / 6px 6px; }
/* LAR at full size, his feet on the horizon. */
.lh-perch { position: relative; flex: none; align-self: stretch; width: 88px; margin-bottom: calc(-1 * var(--lh-base)); overflow: hidden; transition: width 0.34s var(--ease); }
.lh-cv { position: absolute; left: 50%; bottom: 0; translate: -50% 0; image-rendering: pixelated; transform-origin: 50% 100%; scale: 1; margin-bottom: -14px; transition: scale 0.34s var(--ease), margin 0.34s var(--ease); }
.lh-who { flex: 1; min-width: 0; display: grid; gap: 4px; align-content: end; }
.lh-tag { font: 600 16px/1 var(--f-pixel); letter-spacing: 0.12em; color: #fff6dc; text-shadow: 0 2px 0 rgb(6 3 7 / 0.55); }
.lh-st { display: flex; align-items: center; gap: 6px; height: 16px; font: 500 12.5px/1 var(--f-ui); color: rgb(255 246 220 / 0.82); text-shadow: 0 1px 0 rgb(6 3 7 / 0.6); white-space: nowrap; overflow: hidden; }
/* The live pixel: gold and still at rest, blinking while he works. */
.lh-st::before { content: ""; flex: none; width: 6px; height: 6px; background: var(--r4); box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.5), inset -2px 0 0 rgb(0 0 0 / 0.25); }
.lh-st:has(i)::before { animation: lhBlink 0.8s steps(1, end) infinite; }
.lh-st i { flex: none; width: 3px; height: 3px; background: currentColor; animation: lhBlink 1s steps(2, jump-none) infinite; }
.lh-st i:nth-of-type(2) { animation-delay: 0.2s; } .lh-st i:nth-of-type(3) { animation-delay: 0.4s; }
.lh-btns { flex: none; display: flex; gap: 6px; }
.phone .lh-ib { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border: 0; padding: 0; color: #fff6dc;
  background: rgb(6 3 8 / 0.34); clip-path: var(--n3);
  box-shadow: inset 0 1px 0 rgb(255 246 220 / 0.16), inset 0 -2px 0 rgb(0 0 0 / 0.32);
  transition: background 0.16s var(--ease), translate 0.1s var(--ease); }
.phone .lh-ib:hover { background: rgb(6 3 8 / 0.5); }
.phone .lh-ib:active { translate: 0 1px; box-shadow: inset 0 2px 0 rgb(0 0 0 / 0.32); }
.lh-ib[hidden] { display: none; }
.lh-ib svg { display: block; filter: drop-shadow(0 1px 0 rgb(6 3 7 / 0.5)); }
.lh.lh-small { --lh-h: 64px; --lh-base: 12px; }
.lh-small .lh-perch { width: 60px; }

function encodeTheme(t) {

}

    layout: () => `<h3 class="ttl">Layout</h3>${seg("opens", ["Today", "Schedule", "Study"], "App opens on")}${seg("density", [["comfy", "Comfy"], ["compact", "Compact"]], "Lists")}<div class="field"><p class="lb">Today's cards</p><div class="card" style="padding:2px 12px">${st.cards.map(([n, on], i) => `<div class="reorder ${on ? "" : "off"}"><input class="pchk" type="checkbox" ${on ? "checked" : ""} data-cardon="${i}" aria-label="Show ${n}"><span>${n}</span><button data-mv="${i},-1" ${i ? "" : "disabled"} aria-label="Move ${n} up">${pi("up", 14)}</button><button data-mv="${i},1" ${i < st.cards.length - 1 ? "" : "disabled"} aria-label="Move ${n} down">${pi("down", 14)}</button></div>`).join("")}</div></div>`,
    motion: () => `<h3 class="ttl">Motion and effects</h3>${seg("dive", ["Full", "Short", "Off"], "The dive on opening")}${seg("effects", ["Full", "Calm", "Off"], "Done effects")}<div class="card" style="padding:2px 12px">${sw("ground", "Moving ground")}${sw("haptics", "Haptics")}${sw("sound", "Sounds")}</div><p class="fine">If Reduce Motion is on in your phone's settings, it wins over all of these.</p>`,
    reminders: () => `<h3 class="ttl">Reminders</h3>${seg("lead", [[0, "Off"], [5, "5"], [10, "10"], [15, "15"], [30, "30"]], "Before each class, minutes")}${seg("deadline", ["Off", "6 PM", "7 PM", "8 PM"], "Deadlines, the evening before")}${seg("study", ["Off", "7 AM", "7 PM", "9 PM"], "Study, on days cards are due")}<div class="card" style="padding:2px 12px">${sw("warm", "Warm-up in class reminders")}${sw("after", "Note after class")}${sw("brief", "Sunday brief")}</div><p class="fine">At most 3 a day besides class reminders, none from 10 PM to 7 AM.</p>`,
    calendar: () => `<h3 class="ttl">Calendar</h3><div class="card" style="padding:2px 12px">${sw("cal", "Keep classes in my calendar")}${sw("events", "Show my own events")}</div><p class="fine">Holds the next eight weeks of classes. Your other calendars are never touched.</p><div class="field"><p class="lb">Last day of classes</p><div class="search" style="color:var(--ink)">Mar 20, 2027</div></div><button class="btn go">Add classes to calendar</button>`,
    assis: () => `<h3 class="ttl">IntAssis</h3><p class="fine">LAR's chat runs on this phone, after you download a model.</p><button class="btn go">Set up LAR's chat</button>`,
    backup: () => `<h3 class="ttl">Backup and data</h3><div class="card" style="display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px"><span>Notes</span><b>84 KB</b><span>Photos in notes</span><b>0 KB</b><span>Decks</span><b>96 KB</b><span>Syllabus and goals</span><b>32 KB</b></div><button class="btn go">Export everything</button><button class="btn">Restore from a file</button><p class="fine">One file with your notes, decks, syllabus pages and themes. Your logins are never in it. Restoring asks before it replaces anything.</p>`,
    privacy: () => `<h3 class="ttl">Privacy</h3><div class="card" style="padding:2px 12px">${sw("lock", "Lock with Face ID")}</div><p class="fine">Asks when IntPortal opens or comes back after a minute away, and hides the screen in the app switcher.</p><p class="fine">Signing out keeps your notes, decks, syllabus pages and goals for when you sign back in.</p><button class="btn" style="color:var(--bad, #f07a6e) !important">Erase everything</button>`,
  };
  const page = (id, anim = true) => { $(".ypage", el)?.remove(); const p = document.createElement("div"); p.className = "ypage" + (anim ? " in" : ""); p.dataset.id = id; p.innerHTML = `<div class="yb">${PAGES[id]()}</div><button class="yback" data-home>${pi("backi", 14)}You</button>`; el.appendChild(p); };
  const apply = () => { const t = PRESETS.find((x) => x.name === st.room) || NIGHT; dress(el, t); el.dataset.density = st.density; $(".ground", el).style.setProperty("--aura-o", st.ground ? (t.aura === "soft" ? 0.55 : 1) : 0); };
  const syncQk = () => $$("[data-qk]", el).forEach((b) => b.setAttribute("aria-pressed", String(st[b.dataset.qk])));
  el.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]"); if (go) return page(go.dataset.go);
    if (e.target.closest("[data-home]")) { $(".ypage", el)?.remove(); home(); return; }
    const q = e.target.closest("[data-qk]"); if (q) { st[q.dataset.qk] = !st[q.dataset.qk]; syncQk(); apply(); return; }
    const sg = e.target.closest("[data-seg]"); if (sg) { const k = sg.dataset.seg; st[k] = isNaN(+sg.dataset.v) ? sg.dataset.v : +sg.dataset.v; apply(); page($(".ypage", el).dataset.id, false); return; }
    const r = e.target.closest("[data-room]"); if (r) { st.room = r.dataset.room; apply(); page("theme", false); return; }
    const mv = e.target.closest("[data-mv]"); if (mv) { const [i, d] = mv.dataset.mv.split(",").map(Number); [st.cards[i], st.cards[i + d]] = [st.cards[i + d], st.cards[i]]; page("layout", false); }
  });
  el.addEventListener("change", (e) => {
    const b = e.target.closest("[data-sw]"); if (b) { st[b.dataset.sw] = b.checked; syncQk(); apply(); }
    const c = e.target.closest("[data-cardon]"); if (c) { st.cards[+c.dataset.cardon][1] = c.checked; page("layout", false); }
  });
  el.addEventListener("input", (e) => {
    if (!e.target.matches("[data-q]")) return;
    const q = e.target.value.trim().toLowerCase(), res = $("#res", v), hm = $("#hm", v);
    if (!q) { res.hidden = true; hm.style.display = "grid"; return; }
    const hit = ALL.filter(([, n, , k]) => `${n} ${k}`.toLowerCase().includes(q));
    res.hidden = false; hm.style.display = "none";
    res.innerHTML = hit.length ? `<div class="list">${hit.map(row).join("")}</div>` : `<p class="fine" style="padding:12px">No setting matches "${esc(e.target.value)}".</p>`;
  });
  home(); apply();
}

/* ---------------- LAR ---------------- */
const lars = new Set();
const LBOX = LarKit.BOX, LW = (LBOX.x1 - LBOX.x0) * 2, LH = (LBOX.y1 - LBOX.y0) * 2;
function startLar(cv, getTheme) { cv.width = LW; cv.height = LH; cv.style.width = LW + "px"; cv.style.height = LH + "px"; cv._rig = LarKit.rig("idle"); cv._theme = getTheme; lars.add(cv); return cv; }
let lastLar = 0;
function larLoop(ts) {
  if (ts - lastLar > 66) {
    lastLar = ts; const t = reduce ? 0 : ts / 1000;
    for (const cv of lars) {
      if (!cv.isConnected) { lars.delete(cv); continue; }
      const r = cv.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) continue;
      if (cv._happyUntil && t > cv._happyUntil) { cv._rig.set("idle", t); cv._happyUntil = 0; }
      const g = cv.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
      g.imageSmoothingEnabled = false; g.save(); g.translate(-LBOX.x0 * 2, -LBOX.y0 * 2); g.scale(2, 2);
      try { LarKit.drawLar(g, cv._rig.at(t, {}, reduce), cv._theme(), t, { shadow: false }); } catch { /* the sketch can do without him */ }
      g.restore();
    }
  }
  requestAnimationFrame(larLoop);
}
requestAnimationFrame(larLoop);
const larTheme = (h) => { if (h == null) return LarKit.THEMES.sis; return { ramp: [0.1, 0.2, 0.36, 0.56, 0.84].map((L) => hsl(h, 0.7, L)), accent: hsl(h, 0.8, 0.64) }; };

/* ---------------- picks ---------------- */
const ROWS = [["morph", "Opening"], ["chat", "Chat"]];
let picks = {};
try { picks = JSON.parse(localStorage.getItem("ip-larchat-4") || "{}"); } catch { picks = {}; }
function renderTray() {
  $("#chips").innerHTML = ROWS.map(([k, l]) => `<span class="${picks[k] ? "set" : ""}">${l}${picks[k] ? ": " + esc(picks[k]) : ""}</span>`).join("");
  $$(".pick").forEach((b) => b.setAttribute("aria-pressed", String(picks[b.dataset.row] === b.dataset.v)));
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".pick"); if (!b) return;
  picks[b.dataset.row] = b.dataset.v;
  try { localStorage.setItem("ip-larchat-4", JSON.stringify(picks)); } catch {}
  renderTray();
});
$("#copy").addEventListener("click", () => {
  const text = "IntPortal picks, LAR chat round four:\n" + ROWS.map(([k, l]) => `- ${l}: ${picks[k] || "(no pick)"}`).join("\n");
  const done = (m) => { $("#toast").textContent = m; setTimeout(() => ($("#toast").textContent = ""), 2400); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#chips")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done("Copying is blocked here. The picks are selected, so copy them by hand."); };
  if (!navigator.clipboard) return fallback();
  navigator.clipboard.writeText(text).then(() => done("Copied. Paste it into the chat."), fallback);
});

/* ---------------- shared: LAR's header ---------------- */
/* The header's two icons, on one 7 x 7 pixel grid at 2 px a pixel, so they sit together. */
const lhIcon = (d, label) => `<svg width="14" height="14" viewBox="0 0 7 7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
const LH_NEW = lhIcon("M3 0h1v3h3v1H4v3H3V4H0V3h3z");
const LH_X = lhIcon("M0 0h1v1H0zM1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM6 0h1v1H6zM5 1h1v1H5zM4 2h1v1H4zM2 4h1v1H2zM1 5h1v1H1zM0 6h1v1H0z");
const larHeader = () => `<div class="lh"><div class="lh-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="lh-perch" aria-hidden="true"><canvas class="lh-cv"></canvas></div><div class="lh-who"><span class="lh-tag">LAR</span><span class="lh-st" aria-live="polite">On this phone</span></div><div class="lh-btns"><button class="lh-ib lh-new" type="button" aria-label="New chat" hidden>${LH_NEW}</button><button class="lh-ib lh-x" type="button" aria-label="Close">${LH_X}</button></div></div>`;
/** The sky takes the room's portal ramp. */
const skyRamp = (el, ramp = PUP_RAMP) => ramp.forEach((c, i) => el.style.setProperty(`--r${i}`, c));
/* LAR in the header, the app's rig and art without his old pixel cube. `on` false draws nothing;
   `fold` set plays his spawn backwards, so he coarsens into blocks and his fire takes him. */
const headLars = new Set();
function headLar(cv) { cv.width = LW; cv.height = LH; cv.style.width = LW + "px"; cv.style.height = LH + "px"; const L = { cv, rig: LarKit.rig("idle"), on: true, fold: 0, back: 0, clock: () => performance.now() / 1000 }; headLars.add(L); return L; }
let headLast = 0;
(function headLoop(ts) {
  if (ts - headLast > 33) {
    headLast = ts;
    for (const L of headLars) {
      const t = L.clock(), g = L.cv.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, LW, LH);
      if (!L.on) continue;
      if (L.back && t > L.back) { L.rig.set("idle", t); L.back = 0; }
      let o = {};
      if (L.fold) { const k = clamp((t - L.fold) / 0.3); if (k >= 1) { L.on = false; L.fold = 0; continue; } o = { k: 1 - k }; }
      g.imageSmoothingEnabled = false; g.save(); g.translate(-LBOX.x0 * 2, -LBOX.y0 * 2); g.scale(2, 2);
      try { LarKit.drawLar(g, L.rig.at(t, o, reduce), larTheme(null), reduce ? 0 : t, { shadow: false, cube: false }); } catch { /* the sketch can do without him */ }
      g.restore();
    }
  }
  requestAnimationFrame(headLoop);
})(0);
/*ROWJS*/
renderTray();
window.__lw = { crystals: crystalTick };
})();
</script>
