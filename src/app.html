<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IntPortal</title>
    <style>html,body{background:#1f1f22}</style>
    <script>
      addEventListener("error", (e) => document.body && document.body.insertAdjacentHTML("afterbegin", "<pre style='color:#f88;white-space:pre-wrap;padding:60px 16px 0'>" + e.message + " @ " + e.filename + ":" + e.lineno + "</pre>"));
      addEventListener("unhandledrejection", (e) => document.body && document.body.insertAdjacentHTML("afterbegin", "<pre style='color:#fa8;white-space:pre-wrap;padding:60px 16px 0'>" + (e.reason && (e.reason.stack || e.reason)) + "</pre>"));
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
