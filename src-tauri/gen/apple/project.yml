name: intportal
# The App Group lets the home-screen widget read the next class. A free Apple
# team can't sign with it, so it's opt-in: INTPORTAL_APP_GROUP=true.
include:
  - path: app-group.yml
    enable: ${INTPORTAL_APP_GROUP}
options:
  bundleIdPrefix: ph.intportal.app
  deploymentTarget:
    iOS: "16.0"
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settings:
  base:
    # Filled in by xcodegen from the environment (scripts/phone.sh); no team id in git.
    DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
settingGroups:
  app:
    base:
      PRODUCT_NAME: IntPortal
      PRODUCT_BUNDLE_IDENTIFIER: ph.intportal.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  intportal_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        # libapp.a is linked below; as a source it also became a resource that
        # pointed at the debug copy, so a release-only build failed to copy it.
        excludes: ["**/*.a"]
      - path: intportal_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: intportal_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "0.1.8"
        CFBundleVersion: "0.1.8"
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: IntPortal uses Face ID to keep your notes, grades and schedule private when the app lock is on.
        NSCalendarsFullAccessUsageDescription: IntPortal keeps your classes in an IntPortal calendar and counts your own events as busy time when it suggests study breaks.
        NSCalendarsUsageDescription: IntPortal keeps your classes in an IntPortal calendar and counts your own events as busy time when it suggests study breaks.
    entitlements:
      path: intportal_iOS/intportal_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: IntPortalWidget
        embed: true
        codeSign: true
      - framework: libapp.a
        embed: false
      - sdk: Accelerate.framework # llama.cpp (ggml) uses vDSP
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  IntPortalWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: IntPortalWidget
      - path: Shared
    info:
      path: IntPortalWidget/Info.plist
      properties:
        CFBundleDisplayName: IntPortal
        CFBundleShortVersionString: "0.1.8"
        CFBundleVersion: "0.1.8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IntPortalWidget/IntPortalWidget.entitlements
    settings:
      base:
        PRODUCT_NAME: IntPortalWidget
        PRODUCT_BUNDLE_IDENTIFIER: ph.intportal.app.widget
        ARCHS: [arm64]
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
