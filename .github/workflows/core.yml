name: Core
on:
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p intportal-core
      - run: cargo clippy -p intportal-core --all-targets -- -D warnings
