name: iOS
on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target

# Proves the Swift plugins and the Xcode project build; desktop cargo never
# compiles them. Simulator only, so no signing.
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: src-tauri/gen/apple
        run: |
          # Gitignored folders the Tauri build fills; XcodeGen wants them to exist.
          mkdir -p Externals assets
          APPLE_DEVELOPMENT_TEAM= INTPORTAL_APP_GROUP=false xcodegen generate
      - run: pnpm tauri ios build --target aarch64-sim --debug
      - name: App size
        run: du -sh src-tauri/gen/apple/build/arm64-sim/IntPortal.app
